<style>
/* Layout: mesa de investigação. Um quadro de cortiça infinito com fotos, provas e fios vermelhos; barra fixa no topo e painel de detalhes que abre ao tocar num item. */
*,*::before,*::after{box-sizing:border-box}
:root{
  --ink:#101418; --muted:#59626c; --paper:#fffdf7; --kraft:#efe3c8; --red:#b3141b; --accent:#0b4f8a; --cork:#b98a5a; --frame:#5c3f24;
  --head:"Newsreader",Georgia,serif; --ui:"Libre Franklin",system-ui,sans-serif; --type:"Special Elite","Courier New",monospace;
  color-scheme:light;
}
html,body{height:100%;margin:0}
body{background:var(--frame);color:var(--ink);font:400 15px/1.5 var(--ui);overflow:hidden}
[hidden]{display:none!important}
a{color:inherit}
button{font:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

.barra{position:fixed;top:0;left:0;right:0;z-index:20;display:flex;gap:.6rem;align-items:center;flex-wrap:wrap;
  padding:calc(.55rem + env(safe-area-inset-top,0px)) max(12px,env(safe-area-inset-right,0px)) .55rem max(12px,env(safe-area-inset-left,0px));
  background:rgba(255,253,247,.96);border-bottom:3px solid var(--red);box-shadow:0 2px 8px rgba(0,0,0,.25)}
.barra h1{margin:0;font:800 1.15rem/1.1 var(--head)}
.barra nav{display:flex;gap:.9rem;font-size:.82rem;font-weight:700}
.barra nav a{text-decoration:none;color:var(--muted)}
.barra nav a:hover{color:var(--red)}
.busca{flex:1 1 12rem;min-width:0;max-width:22rem;font:inherit;font-size:.9rem;padding:.4rem .7rem;border:1px solid var(--muted);border-radius:6px;background:#fff}
.ctrl{display:flex;gap:.3rem;margin-left:auto}
.ctrl button{width:2.2rem;height:2.2rem;border-radius:6px;border:1px solid var(--ink);background:#fff;cursor:pointer;font-weight:800}
.ctrl button.txt{width:auto;padding:0 .7rem;font-size:.8rem}
.grupos{position:fixed;left:max(12px,env(safe-area-inset-left,0px));bottom:calc(12px + env(safe-area-inset-bottom,0px));z-index:15;display:flex;flex-wrap:wrap;gap:.35rem;max-width:min(40rem,calc(100% - 24px))}
.grupos button{font-size:.75rem;font-weight:700;padding:.35rem .65rem;border-radius:999px;border:1px solid var(--ink);background:var(--paper);cursor:pointer;box-shadow:0 1px 3px rgba(0,0,0,.3)}
.grupos button:hover{background:var(--ink);color:#fff}

#mesa{position:fixed;inset:0;touch-action:none;cursor:grab;overflow:hidden;
  background-color:var(--cork);background-image:radial-gradient(rgba(0,0,0,.13) 1px,transparent 1.6px),radial-gradient(rgba(255,255,255,.1) 1px,transparent 1.6px);background-size:8px 8px,13px 13px}
#mesa.arrastando{cursor:grabbing}
#mundo{position:absolute;left:0;top:0;width:3200px;height:2600px;transform-origin:0 0}
#fios{position:absolute;left:0;top:0;width:3200px;height:2600px;overflow:visible;pointer-events:none}
#fios path{fill:none;stroke:var(--red);stroke-width:2.4;stroke-linecap:round;filter:drop-shadow(0 1px 1px rgba(0,0,0,.45));transition:opacity .2s}
.rotulo-grupo{position:absolute;transform:translate(-50%,-50%) rotate(-2deg);font:400 2.2rem/1 var(--type);color:var(--paper);background:var(--ink);padding:.35rem .9rem;letter-spacing:.04em;white-space:nowrap;box-shadow:0 3px 6px rgba(0,0,0,.4)}
.tag{position:absolute;transform:translate(-50%,-50%);max-width:170px;font:400 .72rem/1.2 var(--type);background:var(--kraft);color:#2a2418;padding:.2rem .4rem;text-align:center;box-shadow:0 1px 3px rgba(0,0,0,.35);pointer-events:none;transition:opacity .2s}
#mesa.longe .tag{opacity:0}
.no{position:absolute;transform:translate(-50%,-50%) rotate(var(--r,0deg));border:0;padding:.45rem .45rem .6rem;background:var(--paper);box-shadow:0 4px 9px rgba(0,0,0,.4);cursor:pointer;display:grid;gap:.25rem;text-align:center;color:var(--ink);transition:opacity .2s, box-shadow .2s}
.no::before{content:"";position:absolute;top:-8px;left:50%;width:16px;height:16px;margin-left:-8px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#ff6b6b,#a10f15);box-shadow:0 2px 2px rgba(0,0,0,.45)}
.no.pessoa{width:150px}
.no.prova{width:190px;background:var(--kraft);text-align:left}
.no.centro{width:210px;outline:4px solid var(--red)}
.no img,.no .ini{width:100%;aspect-ratio:1;object-fit:cover;object-position:50% 22%;display:block;filter:grayscale(.3) contrast(1.05)}
.no.prova img{aspect-ratio:4/3;filter:sepia(.25)}
.no .ini{display:grid;place-items:center;background:#e4dcc6;font:800 2.6rem var(--head);color:#8a7f66}
.no b{font-size:.92rem;line-height:1.15}
.no.prova b{font:400 .95rem/1.25 var(--type)}
.no small{font-size:.74rem;color:var(--muted);line-height:1.25}
.no .data{font:400 .72rem var(--type);color:var(--red)}
.no .carimbo{position:absolute;top:34%;left:50%;transform:translate(-50%,-50%) rotate(-12deg);font:800 .72rem var(--ui);letter-spacing:.07em;color:var(--red);border:2px solid var(--red);padding:.05rem .35rem;background:rgba(255,253,247,.85);white-space:nowrap;text-transform:uppercase}
.no .ia{position:absolute;right:.5rem;top:.5rem;font:700 .58rem var(--ui);background:rgba(16,20,24,.75);color:#fff;padding:.05rem .3rem;border-radius:2px}
#mesa.foco .no:not(.ativo){opacity:.28}
#mesa.foco #fios path:not(.ativo),#mesa.foco .tag:not(.ativo){opacity:.08}
.no.achado{box-shadow:0 0 0 5px #ffd23f,0 4px 9px rgba(0,0,0,.4)}

.painel{position:fixed;z-index:30;right:max(12px,env(safe-area-inset-right,0px));top:calc(70px + env(safe-area-inset-top,0px));bottom:calc(12px + env(safe-area-inset-bottom,0px));width:min(24rem,calc(100% - 24px));overflow:auto;background:var(--paper);box-shadow:0 8px 24px rgba(0,0,0,.45);padding:1.1rem 1.1rem 1.3rem;display:grid;gap:.7rem;align-content:start;border-top:6px solid var(--red)}
.painel h2{margin:0;font:800 1.5rem/1.15 var(--head);padding-right:2rem}
.painel .fechar{position:absolute;top:.6rem;right:.6rem;width:2rem;height:2rem;border:1px solid var(--ink);background:#fff;border-radius:50%;cursor:pointer;font-weight:800}
.painel img{width:100%;border-radius:2px}
.painel .data{font:400 .85rem var(--type);color:var(--red)}
.painel p{margin:0}
.painel .lig{margin:0;padding-left:1.1rem;display:grid;gap:.3rem;font-size:.9rem}
.painel .lig button{background:none;border:0;padding:0;color:var(--accent);font-weight:700;cursor:pointer;text-align:left;text-decoration:underline;text-underline-offset:3px}
.painel .fontes{display:flex;flex-wrap:wrap;gap:.3rem .9rem;font-size:.85rem}
.painel .fontes a{color:var(--accent);font-weight:600}
.painel .ver{display:inline-block;justify-self:start;background:var(--ink);color:#fff;text-decoration:none;font-weight:800;padding:.55rem .9rem;border-radius:6px}
.painel .cred{font-size:.74rem;color:var(--muted)}
@media (max-width:40rem){
  .painel{top:auto;left:max(12px,env(safe-area-inset-left,0px));width:auto;max-height:62vh}
  .barra h1{font-size:1rem}.barra nav{order:3;width:100%}.busca{order:4;max-width:none}
  .grupos{display:none}
}
.ajuda{position:fixed;z-index:15;right:max(12px,env(safe-area-inset-right,0px));bottom:calc(12px + env(safe-area-inset-bottom,0px));font-size:.75rem;background:rgba(255,253,247,.92);padding:.35rem .6rem;border-radius:6px;max-width:16rem}
@media (max-width:40rem){.ajuda{left:max(12px,env(safe-area-inset-left,0px));right:auto}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

const OX=1600, OY=1300;
const mesa=document.getElementById('mesa'), mundo=document.getElementById('mundo'), svg=document.getElementById('fios'), nosEl=document.getElementById('nos'), tagsEl=document.getElementById('tags'), painel=document.getElementById('painel');
const byId=Object.fromEntries(N.map(n=>[n[0],n]));
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const rot=id=>{let h=0;for(const c of id)h=(h*31+c.charCodeAt(0))%997;return (h%7)-3};

// rótulos de grupo
let html='';
for(const [k,[t,x,y]] of Object.entries(G)) html+=`<div class="rotulo-grupo" style="left:${x+OX}px;top:${y+OY}px">${t}</div>`;
// nós
html+=N.map(([id,tp,g,x,y,t,sub,img,stamp,data])=>{
  const cls=id==='flavio'?'no pessoa centro':(tp==='p'?'no pessoa':'no prova');
  const ini=t.replace(/".*?"/g,'').split(/\s+/).filter(w=>/^[A-ZÁÉÍÓÚ]/.test(w)).slice(0,2).map(w=>w[0]).join('');
  const ia=img.includes('/ia-')?'<span class="ia">ilustração IA</span>':'';
  return `<button type="button" class="${cls}" data-id="${id}" style="left:${x+OX}px;top:${y+OY}px;--r:${rot(id)}deg">${img?`<img src="${img}" alt="" loading="lazy">`:(tp==='p'?`<span class="ini" aria-hidden="true">${ini}</span>`:'')}${ia}${data&&tp==='e'?`<span class="data">${esc(data)}</span>`:''}<b>${esc(t)}</b><small>${esc(sub)}</small>${stamp?`<span class="carimbo">${stamp}</span>`:''}</button>`}).join('');
nosEl.innerHTML=html;
// fios
let ps='', ts='';
E.forEach(([a,b,l],i)=>{const A=byId[a],B=byId[b]; if(!A||!B) return; const x1=A[3]+OX,y1=A[4]+OY,x2=B[3]+OX,y2=B[4]+OY; const d=Math.hypot(x2-x1,y2-y1); const mx=(x1+x2)/2,my=(y1+y2)/2+Math.min(90,d*.12);
  ps+=`<path d="M${x1} ${y1} Q${mx} ${my} ${x2} ${y2}" data-a="${a}" data-b="${b}"/>`;
  if(l) ts+=`<span class="tag" data-a="${a}" data-b="${b}" style="left:${(x1+2*mx+x2)/4}px;top:${(y1+2*my+y2)/4}px">${esc(l)}</span>`;});
svg.innerHTML=ps; tagsEl.innerHTML=ts;

// câmera
let cam={x:0,y:0,k:.5};
const aplicar=()=>{mundo.style.transform=`translate(${cam.x}px,${cam.y}px) scale(${cam.k})`; mesa.classList.toggle('longe',cam.k<.55);};
const zoomEm=(f,cx,cy)=>{const k=Math.min(2.2,Math.max(.18,cam.k*f)); const r=k/cam.k; cam.x=cx-(cx-cam.x)*r; cam.y=cy-(cy-cam.y)*r; cam.k=k; aplicar();};
const irPara=(x,y,k)=>{cam.k=k??cam.k; const w=mesa.clientWidth,h=mesa.clientHeight; cam.x=w/2-(x+OX)*cam.k; cam.y=(h+60)/2-(y+OY)*cam.k; aplicar();};
const verTudo=()=>{const xs=N.map(n=>n[3]),ys=N.map(n=>n[4]); const w=mesa.clientWidth,h=mesa.clientHeight-70; const bw=Math.max(...xs)-Math.min(...xs)+420,bh=Math.max(...ys)-Math.min(...ys)+520; const k=Math.max(.18,Math.min(w/bw,h/bh)); irPara((Math.max(...xs)+Math.min(...xs))/2,(Math.max(...ys)+Math.min(...ys))/2,k);};

// arrastar e pinça
const pts=new Map(); let moveu=0, ult=null, pinca=null;
mesa.addEventListener('pointerdown',e=>{mesa.setPointerCapture(e.pointerId); pts.set(e.pointerId,{x:e.clientX,y:e.clientY}); moveu=0; ult={x:e.clientX,y:e.clientY};
  if(pts.size===2){const [p,q]=[...pts.values()]; pinca={d:Math.hypot(p.x-q.x,p.y-q.y)};} mesa.classList.add('arrastando');});
mesa.addEventListener('pointermove',e=>{if(!pts.has(e.pointerId)) return; pts.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(pts.size===2&&pinca){const [p,q]=[...pts.values()]; const d=Math.hypot(p.x-q.x,p.y-q.y); zoomEm(d/pinca.d,(p.x+q.x)/2,(p.y+q.y)/2); pinca.d=d; moveu+=10; return;}
  const dx=e.clientX-ult.x, dy=e.clientY-ult.y; moveu+=Math.abs(dx)+Math.abs(dy); cam.x+=dx; cam.y+=dy; ult={x:e.clientX,y:e.clientY}; aplicar();});
const solta=e=>{pts.delete(e.pointerId); if(pts.size<2) pinca=null; if(pts.size===1) ult=[...pts.values()][0]; if(!pts.size) mesa.classList.remove('arrastando');};
mesa.addEventListener('pointerup',e=>{const alvo=document.elementFromPoint(e.clientX,e.clientY)?.closest('.no'); solta(e); if(moveu<8){ if(alvo) abrir(alvo.dataset.id); else fechar(); }});
mesa.addEventListener('pointercancel',solta);
mesa.addEventListener('wheel',e=>{e.preventDefault(); zoomEm(Math.exp(-e.deltaY*.0015),e.clientX,e.clientY);},{passive:false});
nosEl.addEventListener('keydown',e=>{const b=e.target.closest('.no'); if(b&&(e.key==='Enter'||e.key===' ')){e.preventDefault(); abrir(b.dataset.id);}});
nosEl.addEventListener('focusin',e=>{const b=e.target.closest('.no'); if(b&&!b.matches(':hover')){const n=byId[b.dataset.id]; irPara(n[3],n[4]);}});
document.addEventListener('keydown',e=>{if(e.target.matches('input')) return; const s=60; if(e.key==='ArrowLeft'){cam.x+=s;aplicar();} if(e.key==='ArrowRight'){cam.x-=s;aplicar();} if(e.key==='ArrowUp'){cam.y+=s;aplicar();} if(e.key==='ArrowDown'){cam.y-=s;aplicar();} if(e.key==='+'||e.key==='=') zoomEm(1.2,innerWidth/2,innerHeight/2); if(e.key==='-') zoomEm(1/1.2,innerWidth/2,innerHeight/2); if(e.key==='Escape') fechar();});
document.getElementById('zmais').onclick=()=>zoomEm(1.25,innerWidth/2,innerHeight/2);
document.getElementById('zmenos').onclick=()=>zoomEm(.8,innerWidth/2,innerHeight/2);
document.getElementById('ztudo').onclick=()=>{fechar(); verTudo();};

// foco e painel
const vizinhos=id=>E.filter(([a,b])=>a===id||b===id).map(([a,b,l])=>[a===id?b:a,l]);
function abrir(id){const n=byId[id]; if(!n) return; const [,tp,,x,y,t,sub,img,stamp,data,txt,anc,src]=n; const viz=vizinhos(id);
  mesa.classList.add('foco'); const set=new Set([id,...viz.map(v=>v[0])]);
  nosEl.querySelectorAll('.no').forEach(b=>b.classList.toggle('ativo',set.has(b.dataset.id)));
  [...svg.children,...tagsEl.children].forEach(p=>p.classList.toggle('ativo',p.dataset.a===id||p.dataset.b===id));
  painel.innerHTML=`<button type="button" class="fechar" aria-label="Fechar">×</button><h2>${esc(t)}</h2>${data?`<span class="data">${esc(data)}</span>`:''}${img?`<img src="${img}" alt="">`:''}${img.includes('/ia-')?'<span class="cred">Ilustração gerada por IA (Magnific). Não é foto do fato.</span>':''}<p><b>${esc(sub)}</b></p>${txt?`<p>${esc(txt)}</p>`:''}
   ${viz.length?`<div><b>Ligações (${viz.length})</b><ul class="lig">${viz.map(([v,l])=>`<li><button type="button" data-ir="${v}">${esc(byId[v][5])}</button>${l?`: ${esc(l)}`:''}</li>`).join('')}</ul></div>`:''}
   ${src.length?`<div class="fontes"><b>Fontes</b>${src.map(([l,u])=>`<a href="${u}">${esc(l)} ↗</a>`).join('')}</div>`:''}
   ${anc!==''?`<a class="ver" href="${DOSSIE}#${anc}">Ver no dossiê →</a>`:`<a class="ver" href="${DOSSIE}">Abrir o dossiê →</a>`}`;
  painel.hidden=false; document.getElementById('ajuda').hidden=true;
  painel.querySelector('.fechar').onclick=fechar;
  painel.querySelectorAll('[data-ir]').forEach(b=>b.onclick=()=>{const m=byId[b.dataset.ir]; irPara(m[3],m[4]); abrir(b.dataset.ir);});
  history.replaceState(null,'','#'+id);}
function fechar(){mesa.classList.remove('foco'); painel.hidden=true; nosEl.querySelectorAll('.ativo').forEach(b=>b.classList.remove('ativo')); [...svg.children,...tagsEl.children].forEach(p=>p.classList.remove('ativo')); history.replaceState(null,'',location.pathname);}

// grupos e busca
document.getElementById('grupos').innerHTML=Object.entries(G).map(([k,[t]])=>`<button type="button" data-g="${k}">${t.charAt(0)+t.slice(1).toLowerCase()}</button>`).join('');
document.getElementById('grupos').addEventListener('click',e=>{const b=e.target.closest('[data-g]'); if(!b) return; const ns=N.filter(n=>n[2]===b.dataset.g); const cx=ns.reduce((s,n)=>s+n[3],0)/ns.length, cy=ns.reduce((s,n)=>s+n[4],0)/ns.length; fechar(); irPara(cx,cy,.75);});
const busca=document.getElementById('busca');
busca.addEventListener('input',()=>{const q=busca.value.trim().toLowerCase(); nosEl.querySelectorAll('.no').forEach(b=>b.classList.remove('achado')); if(q.length<2) return;
  const hits=N.filter(n=>(n[5]+' '+n[6]+' '+n[10]).toLowerCase().includes(q)); hits.forEach(n=>nosEl.querySelector(`[data-id="${n[0]}"]`).classList.add('achado')); if(hits[0]) irPara(hits[0][3],hits[0][4],Math.max(cam.k,.7));});
busca.addEventListener('keydown',e=>{if(e.key==='Enter'){const a=nosEl.querySelector('.achado'); if(a) abrir(a.dataset.id);}});

addEventListener('resize',()=>aplicar());
verTudo();
const h0=location.hash.slice(1); if(byId[h0]){const n=byId[h0]; irPara(n[3],n[4],.8); abrir(h0);}
</script>
